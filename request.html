<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>도서신청 | 마나바</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #1d2d4f;
      --text: #222;
      --sub: #777;
      --border: #e8e8e8;
    }

    body {
      margin: 0;
      font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--text);
      background: #fff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(1060px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* 상단 메뉴 */

    header {
      border-bottom: 1px solid var(--border);
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      color: var(--navy);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    nav a:hover {
      color: var(--navy);
    }

    /* 본문 */

    main {
      padding: 42px 0 70px;
    }

    .page-title {
      margin: 0 0 10px;
      font-size: 27px;
      font-weight: 800;
    }

    .page-desc {
      margin: 0 0 26px;
      color: var(--sub);
      font-size: 14px;
      line-height: 1.7;
    }

    .form-box {
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
    }

    .form-box iframe {
      display: block;
      width: 100%;
      height: 760px;
      border: 0;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 32px 0;
      color: var(--sub);
      font-size: 13px;
    }

    @media (max-width: 700px) {

      .wrap {
        width: min(100% - 28px, 1060px);
      }

      header {
        position: static;
      }

      .header-inner {
        min-height: auto;
        padding: 15px 0 11px;
        display: block;
      }

      .logo {
        display: block;
        margin-bottom: 12px;
        font-size: 22px;
      }

      nav {
        gap: 20px;
        overflow-x: auto;
        padding-bottom: 4px;
        font-size: 13px;
      }

      main {
        padding: 34px 0 55px;
      }

      .page-title {
        font-size: 23px;
      }

      .page-desc {
        font-size: 13px;
        margin-bottom: 20px;
      }

      .form-box {
        border: 0;
        border-radius: 0;
      }

      .form-box iframe {
        height: 820px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="wrap header-inner">

    <a class="logo" href="index.html">
      MANAVA
    </a>

    <nav>

      <a href="menu.html">
        이용요금/메뉴
      </a>

      <a href="search.html">
        도서검색
      </a>

      <a href="request.html">
        도서신청
      </a>

      <a href="guide.html">
        이용안내
      </a>

    </nav>

  </div>
</header>


<main>

  <div class="wrap">

    <h1 class="page-title">
      도서신청
    </h1>

    <p class="page-desc">
      읽고 싶은 책을 자유롭게 알려주세요. 신청 전 도서검색을 먼저 확인해주세요.
    </p>

    <div class="form-box">

      <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLSdcOBfKUIlINBBvjPkUN8mjEIxxCnLwIRncy7HLDzk1MPal3Q/viewform?embedded=true"
        loading="lazy"
        title="마나바 도서신청"
      >
        로드 중…
      </iframe>

    </div>

  </div>

</main>


<footer>
  <div class="wrap">
    MANAVA
  </div>
</footer>

</body>
</html>
