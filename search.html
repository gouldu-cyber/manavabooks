<!doctype html>
<html lang="ko">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>도서 검색 | 마나바</title>

<style>

*{
  box-sizing:border-box;
}

:root{
  --navy:#1d2d4f;
  --text:#222;
  --sub:#666;
  --border:#e6e6e6;
}

body{
  margin:0;
  font-family:Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  background:#fff;
  color:var(--text);
}

a{
  color:inherit;
  text-decoration:none;
}


/* =========================
   공통 상단 메뉴
========================= */

header{
  border-bottom:1px solid var(--border);
  background:#fff;
  position:sticky;
  top:0;
  z-index:100;
}

.header-wrap{
  width:min(1060px, calc(100% - 40px));
  margin:0 auto;
}

.header-inner{
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:30px;
}

.logo{
  color:var(--navy);
  font-size:24px;
  font-weight:800;
  letter-spacing:.06em;
  white-space:nowrap;
}

nav{
  display:flex;
  align-items:center;
  gap:28px;
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
}

nav a{
  font-size:14px;
  font-weight:700;
}

nav a:hover{
  color:var(--navy);
}


/* =========================
   도서검색 본문
========================= */

.search-wrap{
  width:min(1200px, calc(100% - 24px));
  margin:0 auto;
  padding:28px 0 60px;
}

.guide{
  margin:0 0 18px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--border);
}

.guide img{
  width:100%;
  height:auto;
  display:block;
}

.title{
  font-size:20px;
  font-weight:700;
  margin:6px 2px 12px;
}

.desc{
  font-size:13px;
  color:var(--sub);
  margin:0 2px 14px;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
}

.search{
  flex:1;
  min-width:0;
  padding:16px 18px;
  font-family:Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  font-size:18px;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
}

.search:focus{
  border-color:#9da7b8;
}

.meta{
  margin:10px 2px 0;
  font-size:13px;
  color:var(--sub);
}

.log{
  margin:6px 2px;
  font-size:12px;
  color:#b00020;
  white-space:pre-wrap;
}

.box{
  margin-top:12px;
  overflow:auto;
  border:1px solid var(--border);
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:15px;
}

thead th{
  text-align:left;
  padding:10px;
  border-bottom:1px solid var(--border);
  background:#fafafa;
  position:sticky;
  top:0;
  font-weight:700;
}

tbody td{
  padding:10px;
  border-bottom:1px solid #f1f1f1;
  white-space:nowrap;
}

mark{
  background:#ffec99;
  padding:0 2px;
  border-radius:3px;
}

.badge{
  display:inline-block;
  padding:4px 9px;
  border:1px solid #d9d9d9;
  border-radius:999px;
  font-size:12px;
  color:#444;
  background:#fff;
  cursor:pointer;
  white-space:nowrap;
}


/* =========================
   모바일
========================= */

@media (max-width:700px){

  .header-wrap{
    width:min(100% - 28px, 1060px);
  }

  header{
    position:static;
  }

  .header-inner{
    min-height:auto;
    padding:15px 0 11px;
    display:block;
  }

  .logo{
    display:block;
    margin-bottom:12px;
    font-size:22px;
    font-weight:800;
  }

  nav{
    gap:20px;
    overflow-x:auto;
    padding-bottom:4px;
    font-size:13px;
  }

  nav a{
    font-size:13px;
    font-weight:700;
  }

  .search-wrap{
    width:calc(100% - 24px);
    padding:20px 0 50px;
  }

  tbody td:nth-child(1),
  thead th:nth-child(1){
    display:none;
  }

  tbody td,
  thead th{
    padding:8px;
    font-size:14px;
  }

}

</style>
</head>


<body>


<header>

  <div class="header-wrap">

    <div class="header-inner">

      <a class="logo" href="index.html">
        MANAVA
      </a>

      <nav>

        <a href="menu.html">
          이용요금/메뉴
        </a>

        <a href="search.html">
          도서검색
        </a>

        <a
          href="https://docs.google.com/forms/d/e/1FAIpQLSdcOBfKUIlINBBvjPkUN8mjEIxxCnLwIRncy7HLDzk1MPal3Q/viewform?usp=publish-editor"
          target="_blank"
          rel="noopener"
        >
          도서신청
        </a>

        <a href="guide.html">
          이용안내
        </a>

      </nav>

    </div>

  </div>

</header>



<div class="search-wrap">

  <div class="guide">

    <img
      src="mnvguide.jpeg"
      alt="마나바 도서 위치 안내"
    >

  </div>


  <div class="title">
    도서 검색
  </div>


  <p class="desc">
    책 제목을 입력하세요.
    예) <b>원피스</b> · 결과에 <b>구역·칸·단</b> 표시
  </p>


  <div class="row">

    <input
      id="q"
      class="search"
      placeholder="예: 원피스 / 킹덤 / 나루토"
    >

    <span
      id="quick"
      class="badge"
      title="앞부분 일치 우선 정렬"
    >
      빠른찾기
    </span>

  </div>


  <div id="meta" class="meta"></div>

  <div id="log" class="log"></div>

  <div
    id="out"
    class="box"
    aria-live="polite"
  ></div>

</div>



<script>

const PRIMARY_URL =
"https://gouldu-cyber.github.io/manavabooks/mnvbooks.json";

const FALLBACK_URL =
"https://raw.githubusercontent.com/gouldu-cyber/manavabooks/main/mnvbooks.json";


// JSON의 실제 키를 이 표준 키로 매핑해 사용
const MAP = {

  "구분": ["구분","분류"],

  "제목": ["제목","title"],

  "구역": ["구역","구역A","shelf","area"],

  "칸": ["칸","col","slot"],

  "단": ["단","row","level"],

  "권수": ["권수","권","vol","count"],

  "완결여부": ["완결여부","완결"],

  "결권": ["결권","마지막권","last"]

};


const COLS = [
  "구분",
  "제목",
  "구역",
  "칸",
  "단",
  "권수",
  "완결여부",
  "결권"
];


const qEl =
document.getElementById('q');

const out =
document.getElementById('out');

const meta =
document.getElementById('meta');

const log =
document.getElementById('log');

const quickEl =
document.getElementById('quick');


let DATA = [];
let IDX = [];
let QUICK = true;



function norm(s){

  if(s == null)
    return "";

  return String(s)
    .normalize('NFKD')
    .toLowerCase()
    .replace(/\s+/g,'')
    .replace(/[\u0300-\u036f]/g,'');

}



function esc(s){

  return String(s ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#39;"
      }[m])
    );

}



// 소스 객체의 키 목록에서 원하는 키 반환
function pick(obj, want){

  const cands =
    MAP[want] || [want];

  for(const k of Object.keys(obj)){

    const kk =
      k.trim();

    if(cands.includes(kk))
      return obj[k];

  }

  return obj[want];

}



function hilite(text, raw){

  if(!raw)
    return esc(text);

  const s =
    String(text ?? "");

  const nText =
    norm(s);

  const nKey =
    norm(raw);

  const i =
    nText.indexOf(nKey);

  if(i < 0)
    return esc(s);

  return esc(s.slice(0,i))
    + "<mark>"
    + esc(s.slice(i, i + raw.length))
    + "</mark>"
    + esc(s.slice(i + raw.length));

}



async function fetchJson(url){

  const r =
    await fetch(
      url,
      {
        cache:"no-store",
        headers:{
          Accept:"application/json"
        }
      }
    );

  if(!r.ok)
    throw new Error(
      `HTTP ${r.status} at ${url}`
    );

  return r.json();

}



async function load(){

  try{

    log.textContent =
      "데이터 로딩 중…";

    let d;

    try{

      d =
        await fetchJson(PRIMARY_URL);

    }

    catch(e1){

      log.textContent =
        "기본 URL 실패, 대체 URL 시도 중…\n"
        + e1;

      d =
        await fetchJson(FALLBACK_URL);

    }


    DATA =
      Array.isArray(d)
      ? d
      : (d.records || []);


    if(!Array.isArray(DATA))
      throw new Error(
        "JSON 형식이 배열이 아닙니다."
      );


    IDX =
      DATA.map(
        (row,i)=>({

          i,

          제목:
            norm(
              pick(row,"제목")
            ),

          구분:
            norm(
              pick(row,"구분") || ""
            )

        })
      );


    log.textContent =
      `로드 성공: ${DATA.length}건`;


    const p =
      new URLSearchParams(
        location.search
      );


    if(p.get('q')){

      qEl.value =
        p.get('q');

      doSearch();

    }

  }

  catch(e){

    log.textContent =
      "로딩 에러: "
      + e.message;


    out.innerHTML =
      `<div style="padding:12px;color:#b00020;">
        데이터를 불러오지 못했습니다.
        JSON 경로 또는 형식을 확인해주세요.
      </div>`;

  }

}


load();



let timer = null;


qEl.addEventListener(
  'input',
  ()=>{

    clearTimeout(timer);

    timer =
      setTimeout(
        doSearch,
        120
      );

  }
);



quickEl.addEventListener(
  'click',
  ()=>{

    QUICK =
      !QUICK;

    quickEl.textContent =
      QUICK
      ? "빠른찾기"
      : "유사찾기";

    doSearch();

  }
);



function doSearch(){

  const raw =
    qEl.value.trim();


  if(!raw){

    out.innerHTML = "";
    meta.textContent = "";

    return;

  }


  const key =
    norm(raw);


  let hits =
    IDX.filter(
      x =>
        x.제목.includes(key)
        ||
        x.구분.includes(key)
    );


  hits.sort(
    (a,b)=>{

      if(QUICK){

        const ap =
          Number(
            a.제목.startsWith(key)
          );

        const bp =
          Number(
            b.제목.startsWith(key)
          );

        return bp - ap
          ||
          a.제목.indexOf(key)
          -
          b.제목.indexOf(key);

      }

      return
        a.제목.indexOf(key)
        -
        b.제목.indexOf(key);

    }
  );


  meta.textContent =
    `검색어: "${raw}" · 결과 ${hits.length}건`;


  if(hits.length === 0){

    out.innerHTML =
      `<div style="padding:12px;">
        검색 결과가 없습니다.
      </div>`;

    return;

  }


  const rows =
    hits
      .slice(0,1000)
      .map(
        h=>{

          const row =
            DATA[h.i];

          return `
          <tr>
            ${
              COLS.map(
                c=>`
                <td>
                  ${
                    esc(
                      pick(row,c) ?? ""
                    )
                  }
                </td>
                `
              ).join('')
            }
          </tr>
          `;

        }
      )
      .join('');


  out.innerHTML =
  `
  <table>

    <thead>
      <tr>
        ${
          COLS.map(
            c=>`<th>${c}</th>`
          ).join('')
        }
      </tr>
    </thead>

    <tbody>
      ${rows}
    </tbody>

  </table>
  `;

}

</script>


</body>
</html>
