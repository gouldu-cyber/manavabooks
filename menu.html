<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>이용요금/메뉴 | 마나바</title>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #1d2d4f;
      --text: #222;
      --sub: #777;
      --border: #e8e8e8;
    }

    body {
      margin: 0;
      font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--text);
      background: #fff;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(1060px, calc(100% - 40px));
      margin: 0 auto;
    }


    /* 상단 */
    header {
      border-bottom: 1px solid var(--border);
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      color: var(--navy);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    nav a:hover {
      color: var(--navy);
    }


    /* 본문 */
    main {
      padding: 52px 0 80px;
    }

    .page-title {
      margin: 0 0 36px;
      font-size: 27px;
      font-weight: 800;
    }

    .menu-images {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .menu-images img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }


    /* 하단 */
    footer {
      border-top: 1px solid var(--border);
      padding: 32px 0;
      color: var(--sub);
      font-size: 13px;
    }


    /* 모바일 */
    @media (max-width: 700px) {

      .wrap {
        width: min(100% - 28px, 1060px);
      }

      header {
        position: static;
      }

      .header-inner {
        min-height: auto;
        padding: 15px 0 11px;
        display: block;
      }

      .logo {
        display: block;
        margin-bottom: 12px;
        font-size: 22px;
      }

      nav {
        gap: 20px;
        overflow-x: auto;
        padding-bottom: 4px;
        font-size: 13px;
      }

      main {
        padding: 36px 0 60px;
      }

      .page-title {
        margin-bottom: 26px;
        font-size: 23px;
      }

      .menu-images {
        gap: 18px;
      }

    }

  </style>
</head>


<body>


<header>

  <div class="wrap header-inner">

    <a class="logo" href="index.html">
      MANAVA
    </a>

    <nav>

      <a href="menu.html">
        이용요금/메뉴
      </a>

      <a href="search.html">
        도서검색
      </a>

      <a
        href="https://docs.google.com/forms/"
        target="_blank"
        rel="noopener"
      >
        도서신청
      </a>

      <a href="guide.html">
        이용안내
      </a>

    </nav>

  </div>

</header>



<main>

  <div class="wrap">

    <h1 class="page-title">
      이용요금 / 메뉴
    </h1>


    <div class="menu-images">

      <img
        src="menu01.jpg"
        alt="마나바 이용요금"
      >

      <img
        src="menu02.jpg"
        alt="마나바 메뉴"
      >

      <img
        src="menu03.jpg"
        alt="마나바 메뉴"
      >

      <img
        src="menu04.jpg"
        alt="마나바 메뉴"
      >

    </div>

  </div>

</main>



<footer>

  <div class="wrap">
    MANAVA
  </div>

</footer>


</body>
</html>
