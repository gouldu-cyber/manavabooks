<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>마나바 | 여수 만화카페</title>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #1d2d4f;
      --text: #222;
      --sub: #777;
      --border: #e8e8e8;
      --soft: #f7f7f7;
    }

    body {
      margin: 0;
      font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--text);
      background: #fff;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(1060px, calc(100% - 40px));
      margin: 0 auto;
    }


    /* =========================
       상단 메뉴
    ========================= */

    header {
      border-bottom: 1px solid var(--border);
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      color: var(--navy);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    nav a:hover {
      color: var(--navy);
    }


    /* =========================
       공지사항
       평소에는 숨김
    ========================= */

    .notice {
      display: none;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
    }

    .notice-inner {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 14px;
    }

    .notice-label {
      color: var(--navy);
      font-weight: 800;
    }

    .notice-date {
      margin-left: auto;
      color: var(--sub);
      font-size: 13px;
      white-space: nowrap;
    }


    /* =========================
       메인
    ========================= */

    main {
      padding: 52px 0 80px;
    }

    .section-title {
      margin: 0 0 42px;
      font-size: 27px;
      font-weight: 800;
    }


    /* =========================
       신간
    ========================= */

    .newbook-box {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 36px;
      align-items: center;
    }

    .newbook-image {
      overflow: hidden;
      border-radius: 10px;
      background: var(--soft);
    }

    .newbook-image img {
      display: block;
      width: 100%;
      height: auto;
    }

    .newbook-info {
      padding: 10px 0;
    }

    .newbook-text {
      margin: 0;
      color: #333;
      font-size: 15px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .instagram-link {
      display: inline-flex;
      align-items: center;
      margin-top: 26px;
      padding-bottom: 3px;
      border-bottom: 1px solid var(--navy);
      color: var(--navy);
      font-size: 14px;
      font-weight: 700;
    }

    .instagram-link:hover {
      opacity: .7;
    }


    /* =========================
       하단
    ========================= */

    footer {
      border-top: 1px solid var(--border);
      padding: 32px 0;
      color: var(--sub);
      font-size: 13px;
    }


    /* =========================
       모바일
    ========================= */

    @media (max-width: 700px) {

      .wrap {
        width: min(100% - 28px, 1060px);
      }

      header {
        position: static;
      }

      .header-inner {
        min-height: auto;
        padding: 15px 0 11px;
        display: block;
      }

      .logo {
        display: block;
        margin-bottom: 12px;
        font-size: 22px;
      }

      nav {
        gap: 20px;
        overflow-x: auto;
        padding-bottom: 4px;
        font-size: 13px;
      }

      .notice-inner {
        min-height: auto;
        padding: 12px 0;
        align-items: flex-start;
      }

      .notice-date {
        display: none;
      }

      main {
        padding: 36px 0 60px;
      }

      .section-title {
        margin-bottom: 26px;
        font-size: 23px;
      }

      .newbook-box {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .newbook-text {
        font-size: 14px;
        line-height: 1.9;
      }

      .instagram-link {
        margin-top: 20px;
      }

    }

  </style>
</head>


<body>


<!-- =========================
     상단
========================= -->

<header>

  <div class="wrap header-inner">

    <a class="logo" href="index.html">
      MANAVA
    </a>

    <nav>

      <a href="menu.html">
        이용요금/메뉴
      </a>

      <a href="search.html">
        도서검색
      </a>

      <!-- 나중에 #을 구글폼 주소로 변경 -->
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSdcOBfKUIlINBBvjPkUN8mjEIxxCnLwIRncy7HLDzk1MPal3Q/viewform?usp=sharing&ouid=105358521387744900710" target="_blank">
        도서신청
      </a>

      <a href="guide.html">
        이용안내
      </a>

    </nav>

  </div>

</header>



<!-- =========================
     공지

     평소에는 보이지 않습니다.

     공지를 띄울 때
     style="display:none;"
     ↓
     style="display:block;"
     으로 변경하세요.
========================= -->

<div class="notice" style="display:none;">

  <div class="wrap notice-inner">

    <span class="notice-label">
      공지
    </span>

    <span>
      추석 연휴 운영 안내입니다.
    </span>

    <span class="notice-date">
      2026.09.01
    </span>

  </div>

</div>



<!-- =========================
     메인
========================= -->

<main>

  <div class="wrap">

    <section>

      <h1 class="section-title">
        새로 들어왔어요
      </h1>


      <div class="newbook-box">


        <!-- =====================
             신간 이미지

             새 신간이 들어오면
             new01.jpg 이미지만 교체
        ====================== -->

        <div class="newbook-image">

          <img
            src="new01.jpg"
            alt="마나바 신간"
          >

        </div>



        <!-- =====================
             신간 도서 목록

             아래 책 이름만
             수정하면 됩니다.
        ====================== -->

        <div class="newbook-info">

          <p class="newbook-text">
이번생은가주가되겠습니다 (2부6)
전대대실격(20)
은하영웅전설(31)
윈드브레이커 (15,16)
찍히지 않습니다(07)
켄투리아(01-06)
버서스(01-06)
댄스 댄스 당쇠르(21)
팬텀 버스터즈(07)
보루토: TWO BLUE VORTEX(05)
단다단(21)
디그 잇(03)
손끝과 연연(13)
봄의 폭풍과 몬스터(09)
          </p>


          <!--
            마나바 인스타그램 주소가 정해지면
            아래 주소만 교체
          -->

          <a
            class="instagram-link"
            href="https://www.instagram.com/manava6f"
            target="_blank"
            rel="noopener"
          >
            Instagram에서 더 보기 →
          </a>

        </div>


      </div>

    </section>

  </div>

</main>



<!-- =========================
     하단
========================= -->

<footer>

  <div class="wrap">
    MANAVA
  </div>

</footer>


</body>
</html>
