<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>마나바 | 여수 만화카페</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #1d2d4f;
      --text: #222;
      --sub: #777;
      --border: #e8e8e8;
      --soft: #f7f7f7;
    }

    body {
      margin: 0;
      font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--text);
      background: #fff;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* 상단 */
    header {
      border-bottom: 1px solid var(--border);
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      color: var(--navy);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    nav a:hover {
      color: var(--navy);
    }

    /* 공지 */
    .notice {
      display: none;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
    }

    .notice-inner {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 14px;
    }

    .notice-label {
      color: var(--navy);
      font-weight: 800;
    }

    .notice-date {
      margin-left: auto;
      color: var(--sub);
      font-size: 13px;
      white-space: nowrap;
    }

    /* 메인 */
    main {
      padding: 52px 0 80px;
    }

    .section-title {
      margin: 0 0 8px;
      font-size: 27px;
      font-weight: 800;
    }

    .section-sub {
      margin: 0 0 28px;
      color: var(--sub);
      font-size: 14px;
    }

    /* 신간 */
    .newbook-box {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 36px;
      align-items: center;
    }

    .newbook-image {
      overflow: hidden;
      border-radius: 12px;
      background: var(--soft);
    }

    .newbook-image img {
      display: block;
      width: 100%;
      height: auto;
    }

    .newbook-info {
      padding: 8px 0;
    }

    .newbook-date {
      margin-bottom: 8px;
      color: var(--sub);
      font-size: 13px;
    }

    .newbook-title {
      margin: 0 0 14px;
      font-size: 24px;
      font-weight: 800;
    }

    .newbook-text {
      margin: 0;
      color: #444;
      font-size: 15px;
      line-height: 1.8;
      white-space: pre-line;
    }

    .instagram-link {
      display: inline-flex;
      align-items: center;
      margin-top: 24px;
      padding-bottom: 3px;
      border-bottom: 1px solid var(--navy);
      color: var(--navy);
      font-size: 14px;
      font-weight: 700;
    }

    .instagram-link:hover {
      opacity: .7;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 32px 0;
      color: var(--sub);
      font-size: 13px;
    }

    /* 모바일 */
    @media (max-width: 700px) {

      .wrap {
        width: min(100% - 28px, 1100px);
      }

      header {
        position: static;
      }

      .header-inner {
        min-height: auto;
        padding: 15px 0 11px;
        display: block;
      }

      .logo {
        display: block;
        margin-bottom: 12px;
        font-size: 22px;
      }

      nav {
        gap: 20px;
        overflow-x: auto;
        padding-bottom: 4px;
        font-size: 13px;
      }

      .notice-inner {
        min-height: auto;
        padding: 12px 0;
        align-items: flex-start;
      }

      .notice-date {
        display: none;
      }

      main {
        padding: 36px 0 60px;
      }

      .section-title {
        font-size: 23px;
      }

      .newbook-box {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .newbook-title {
        font-size: 21px;
      }

      .newbook-text {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="wrap header-inner">

    <a class="logo" href="index.html">
      MANAVA
    </a>

    <nav>
      <a href="menu.html">이용요금/메뉴</a>
      <a href="search.html">도서검색</a>

      <!-- 구글폼 주소가 생기면 # 부분을 바꾸면 됨 -->
      <a href="#" target="_blank">도서신청</a>

      <a href="guide.html">이용안내</a>
    </nav>

  </div>
</header>


<!--
공지가 필요할 때만 사용

아래 style="display:none;" 을
style="display:block;" 으로 바꾸면 공지가 나타남
-->

<div class="notice" style="display:none;">
  <div class="wrap notice-inner">

    <span class="notice-label">공지</span>

    <span>
      추석 연휴 운영 안내입니다.
    </span>

    <span class="notice-date">
      2026.09.01
    </span>

  </div>
</div>


<main>
  <div class="wrap">

    <section>

      <h1 class="section-title">신간소식</h1>

      <p class="section-sub">
        마나바에 새로 들어온 책을 소개합니다.
      </p>


      <div class="newbook-box">

        <!-- 최근 신간 이미지 -->
        <div class="newbook-image">
          <img src="new01.jpg" alt="마나바 신간소식">
        </div>


        <!-- 최근 신간 내용 -->
        <div class="newbook-info">

          <div class="newbook-date">
            2026.08.31
          </div>

          <h2 class="newbook-title">
            8월 마지막 신간 입고
          </h2>

          <p class="newbook-text">
신작 및 인기작이 새롭게 입고되었습니다.

자세한 신간 목록과 소식은
마나바 인스타그램에서 확인해주세요.
          </p>


          <!-- 인스타그램 주소 입력 -->
          <a
            class="instagram-link"
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener"
          >
            Instagram에서 더 보기 →
          </a>

        </div>

      </div>

    </section>

  </div>
</main>


<footer>
  <div class="wrap">
    MANAVA
  </div>
</footer>

</body>
</html>
