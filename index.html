<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>마나바 | 여수 만화카페</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #172a46;
      --text: #222;
      --sub: #777;
      --border: #e8e8e8;
      --bg-soft: #f7f7f7;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
      color: var(--text);
      background: #fff;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* 상단 메뉴 */
    header {
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.97);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      color: var(--navy);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    nav a:hover {
      color: var(--navy);
    }


    /* 본문 */
    main {
      padding: 52px 0 80px;
    }

    section {
      margin-bottom: 70px;
    }

    .section-title {
      margin: 0 0 22px;
      font-size: 26px;
      font-weight: 800;
    }


    /* 공지사항 */
    .notice-box {
      border-top: 2px solid var(--navy);
      border-bottom: 1px solid var(--border);
    }

    .notice-item {
      min-height: 62px;
      padding: 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--border);
    }

    .notice-item:last-child {
      border-bottom: 0;
    }

    .notice-title {
      font-size: 15px;
      font-weight: 600;
    }

    .notice-date {
      color: var(--sub);
      font-size: 13px;
      white-space: nowrap;
    }


    /* 신간소식 */
    .newbook-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 22px;
      gap: 20px;
    }

    .newbook-head .section-title {
      margin: 0;
    }

    .newbook-sub {
      margin: 4px 0 0;
      color: var(--sub);
      font-size: 14px;
    }

    .newbook-scroll {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      padding-bottom: 12px;
    }

    .newbook-card {
      flex: 0 0 calc((100% - 32px) / 3);
      scroll-snap-align: start;
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg-soft);
      aspect-ratio: 1 / 1;
    }

    .newbook-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .newbook-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 14px;
    }


    footer {
      border-top: 1px solid var(--border);
      padding: 32px 0;
      color: var(--sub);
      font-size: 13px;
    }


    /* 모바일 */
    @media (max-width: 700px) {

      .wrap {
        width: min(100% - 28px, 1100px);
      }

      header {
        position: static;
      }

      .header-inner {
        height: auto;
        padding: 16px 0 12px;
        display: block;
      }

      .logo {
        display: block;
        margin-bottom: 12px;
        font-size: 22px;
      }

      nav {
        gap: 20px;
        overflow-x: auto;
        padding-bottom: 3px;
        font-size: 13px;
      }

      main {
        padding: 35px 0 60px;
      }

      section {
        margin-bottom: 55px;
      }

      .section-title {
        font-size: 23px;
      }

      .notice-item {
        align-items: flex-start;
        padding: 15px 8px;
      }

      .notice-date {
        font-size: 12px;
      }

      .newbook-card {
        flex: 0 0 100%;
      }
    }
  </style>
</head>


<body>

<header>
  <div class="wrap header-inner">

    <a class="logo" href="index.html">
      MANAVA
    </a>

    <nav>
      <a href="menu.html">이용요금/메뉴</a>
      <a href="search.html">도서검색</a>
      <a href="request.html">도서신청</a>
      <a href="guide.html">이용안내</a>
    </nav>

  </div>
</header>


<main>
  <div class="wrap">


    <!-- 공지사항 -->
    <section id="notice">

      <h2 class="section-title">공지사항</h2>

      <div class="notice-box">

        <div class="notice-item">
          <div class="notice-title">
            마나바 홈페이지가 새롭게 열렸습니다.
          </div>

          <div class="notice-date">
            2026.09.01
          </div>
        </div>

        <div class="notice-item">
          <div class="notice-title">
            공지사항 내용을 입력해주세요.
          </div>

          <div class="notice-date">
            2026.09.01
          </div>
        </div>

      </div>

    </section>


    <!-- 신간소식 -->
    <section id="new">

      <div class="newbook-head">

        <div>
          <h2 class="section-title">신간소식</h2>
          <p class="newbook-sub">
            마나바에 새로 들어온 책입니다.
          </p>
        </div>

      </div>


      <div class="newbook-scroll">

        <div class="newbook-card">
          <div class="newbook-placeholder">
            신간 이미지 1
          </div>
        </div>

        <div class="newbook-card">
          <div class="newbook-placeholder">
            신간 이미지 2
          </div>
        </div>

        <div class="newbook-card">
          <div class="newbook-placeholder">
            신간 이미지 3
          </div>
        </div>

        <div class="newbook-card">
          <div class="newbook-placeholder">
            신간 이미지 4
          </div>
        </div>

        <div class="newbook-card">
          <div class="newbook-placeholder">
            신간 이미지 5
          </div>
        </div>

      </div>

    </section>

  </div>
</main>


<footer>
  <div class="wrap">
    MANAVA
  </div>
</footer>

</body>
</html>
