<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>마나바 | 여수 만화카페</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: #222;
      background: #fff;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid #eee;
      background: rgba(255,255,255,.96);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    nav {
      display: flex;
      gap: 22px;
      font-size: 14px;
      font-weight: 600;
    }

    .hero {
      padding: 90px 0 80px;
      text-align: center;
    }

    .hero h1 {
      margin: 0 0 14px;
      font-size: clamp(36px, 7vw, 64px);
      letter-spacing: .08em;
    }

    .hero p {
      margin: 0 0 32px;
      color: #666;
      font-size: 17px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 8px;
      font-weight: 700;
    }

    .button-dark {
      background: #222;
      color: #fff;
    }

    .button-light {
      border: 1px solid #ddd;
      background: #fff;
    }

    section {
      padding: 70px 0;
    }

    .section-title {
      margin-bottom: 30px;
    }

    .section-title h2 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .section-title p {
      margin: 0;
      color: #777;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .news-card {
      background: #f5f5f5;
      border-radius: 12px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      overflow: hidden;
    }

    .search-box {
      padding: 38px;
      background: #f7f7f7;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .search-box h2 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .search-box p {
      margin: 0;
      color: #666;
    }

    footer {
      margin-top: 60px;
      border-top: 1px solid #eee;
      padding: 40px 0;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .wrap {
        width: min(100% - 28px, 1100px);
      }

      .header-inner {
        min-height: 62px;
      }

      nav {
        gap: 13px;
        font-size: 13px;
      }

      .hero {
        padding: 65px 0 55px;
      }

      section {
        padding: 50px 0;
      }

      .news-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .search-box {
        padding: 28px 22px;
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="wrap header-inner">
    <a class="logo" href="index.html">MANABA</a>

    <nav>
      <a href="#new">신간소식</a>
      <a href="search.html">도서검색</a>
      <a href="#guide">이용안내</a>
    </nav>
  </div>
</header>


<main>

  <section class="hero">
    <div class="wrap">
      <h1>MANABA</h1>
      <p>조용히 책을 읽고 쉬어가는 만화카페</p>

      <div class="buttons">
        <a class="button button-dark" href="search.html">
          도서 검색
        </a>

        <a class="button button-light" href="#new">
          신간 소식
        </a>
      </div>
    </div>
  </section>


  <section id="new">
    <div class="wrap">

      <div class="section-title">
        <h2>신간소식</h2>
        <p>마나바에 새로 들어온 책을 확인하세요.</p>
      </div>

      <div class="news-grid">
        <div class="news-card">신간 이미지 1</div>
        <div class="news-card">신간 이미지 2</div>
        <div class="news-card">신간 이미지 3</div>
        <div class="news-card">신간 이미지 4</div>
        <div class="news-card">신간 이미지 5</div>
        <div class="news-card">신간 이미지 6</div>
      </div>

    </div>
  </section>


  <section>
    <div class="wrap">

      <div class="search-box">
        <div>
          <h2>찾는 책이 있나요?</h2>
          <p>마나바 보유 도서를 제목이나 작가명으로 검색할 수 있습니다.</p>
        </div>

        <a class="button button-dark" href="search.html">
          도서 검색하기
        </a>
      </div>

    </div>
  </section>


  <section id="guide">
    <div class="wrap">

      <div class="section-title">
        <h2>이용안내</h2>
        <p>마나바 이용에 필요한 정보를 안내합니다.</p>
      </div>

      <p>
        운영시간과 이용요금 등은 다음 단계에서 넣겠습니다.
      </p>

    </div>
  </section>

</main>


<footer>
  <div class="wrap">
    MANABA
  </div>
</footer>

</body>
</html>
