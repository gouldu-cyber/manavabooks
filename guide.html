<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>이용안내 | 마나바</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #1d2d4f;
      --text: #222;
      --sub: #777;
      --border: #e8e8e8;
      --soft: #f7f7f7;
    }

    body {
      margin: 0;
      font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--text);
      background: #fff;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(1060px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* =========================
       상단 메뉴
    ========================= */

    header {
      border-bottom: 1px solid var(--border);
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      color: var(--navy);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    nav a:hover {
      color: var(--navy);
    }

    /* =========================
       본문
    ========================= */

    main {
      padding: 52px 0 80px;
    }

    .page-title {
      margin: 0 0 42px;
      font-size: 27px;
      font-weight: 800;
    }

    .guide-section {
      padding: 0 0 38px;
      margin-bottom: 38px;
      border-bottom: 1px solid var(--border);
    }

    .guide-section:last-child {
      border-bottom: 0;
    }

    .guide-title {
      margin: 0 0 14px;
      font-size: 19px;
      font-weight: 800;
    }

    .guide-text {
      margin: 0;
      color: #444;
      font-size: 15px;
      line-height: 1.9;
    }

    .address {
      margin-top: 14px;
      padding: 18px 20px;
      background: var(--soft);
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.8;
    }

    .map-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      min-height: 44px;
      padding: 0 20px;
      border-radius: 8px;
      background: var(--navy);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    .map-button:hover {
      opacity: .85;
    }

    /* =========================
       하단
    ========================= */

    footer {
      border-top: 1px solid var(--border);
      padding: 32px 0;
      color: var(--sub);
      font-size: 13px;
    }

    /* =========================
       모바일
    ========================= */

    @media (max-width: 700px) {

      .wrap {
        width: min(100% - 28px, 1060px);
      }

      header {
        position: static;
      }

      .header-inner {
        min-height: auto;
        padding: 15px 0 11px;
        display: block;
      }

      .logo {
        display: block;
        margin-bottom: 12px;
        font-size: 22px;
      }

      nav {
        gap: 20px;
        overflow-x: auto;
        padding-bottom: 4px;
        font-size: 13px;
      }

      main {
        padding: 36px 0 60px;
      }

      .page-title {
        margin-bottom: 30px;
        font-size: 23px;
      }

      .guide-section {
        padding-bottom: 30px;
        margin-bottom: 30px;
      }

      .guide-title {
        font-size: 18px;
      }

      .guide-text {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="wrap header-inner">

    <a class="logo" href="index.html">
      MANAVA
    </a>

    <nav>
      <a href="menu.html">
        이용요금/메뉴
      </a>

      <a href="search.html">
        도서검색
      </a>

      <!-- 실제 구글폼 주소로 교체 -->
      <a
        href="https://docs.google.com/forms/d/e/1FAIpQLSdcOBfKUIlINBBvjPkUN8mjEIxxCnLwIRncy7HLDzk1MPal3Q/viewform?usp=publish-editor"
        target="_blank"
        rel="noopener"
      >
        도서신청
      </a>

      <a href="guide.html">
        이용안내
      </a>
    </nav>

  </div>
</header>


<main>

  <div class="wrap">

    <h1 class="page-title">
      이용안내
    </h1>


    <!-- 주차안내 -->

    <section class="guide-section">

      <h2 class="guide-title">
        주차안내
      </h2>

      <p class="guide-text">
        여문공영주차장 이용 시 1시간 무료
      </p>

    </section>


    <!-- 찾아오시는 길 -->

    <section class="guide-section">

      <h2 class="guide-title">
        찾아오시는 길
      </h2>

      <div class="address">

        <strong>마나바</strong><br>
        전남 여수시 여서1로 51, 6층

      </div>

      <!-- 실제 네이버지도 링크로 교체 -->

      <a
        class="map-button"
        href="https://naver.me/59UPaQML"
        target="_blank"
        rel="noopener"
      >
        네이버지도에서 보기
      </a>

    </section>


  </div>

</main>


<footer>

  <div class="wrap">
    MANAVA
  </div>

</footer>


</body>
</html>
